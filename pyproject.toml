[project]
name = "backend-fastapi-app"
version = "0.1.0"
description = "Template for backend application use FastAPI"
authors = [
    {name = "kingnnt",email = "dev.kingnnt@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.115.14,<0.116.0)",
    "uvicorn[standard] (>=0.35.0,<0.36.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "motor (>=3.6.0,<4.0.0)",
    "beanie (>=1.29.2,<2.0.0)",
    "sqlmodel (>=0.0.25,<0.0.26)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "alembic (>=1.16.5,<2.0.0)",
    "redis (>=6.4.0,<7.0.0)",
    "typer (>=0.20.0,<0.21.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
ruff = "^0.12.2"
pre-commit = "^4.2.0"
pyright = "^1.1.402"
mypy = "^1.16.1"
testcontainers = {extras = ["postgres", "mongodb"], version = "^4.0"}
import-linter = ">=2.0,<3.0"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (require Docker)",
    "e2e: marks tests as end-to-end tests (require running Docker services)",
]
filterwarnings = [
    # Ignore testcontainers deprecation warnings (external library)
    "ignore::DeprecationWarning:testcontainers.*",
    # Ignore lazy_model/Pydantic model_fields warnings (Beanie ODM dependency)
    "ignore:Accessing the 'model_fields' attribute:pydantic.warnings.PydanticDeprecatedSince211",
    # Ignore pytest-asyncio event_loop fixture redefinition warning (needed for session-scoped fixtures)
    "ignore:The event_loop fixture provided by pytest-asyncio:DeprecationWarning",
]


# =============================================================================
# import-linter — Architectural rule enforcement
# =============================================================================
# These contracts describe the CURRENT (layer-first) architecture.
# They will be replaced by Bounded-Context contracts during the refactor
# (see docs/superpowers/specs/2026-06-21-bc-modular-monolith-refactor-design.md).
[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

# Contract A: Presentation depends on Application, not the other way around.
# Contract B: Domain has zero infrastructure / framework imports.
[[tool.importlinter.contracts]]
name = "Layer boundaries (current architecture)"
type = "layers"
layers = [
    "app.presentation",
    "app.core.application",
    "app.core.domain",
]
# Note: app.infrastructure is intentionally NOT in this layers contract
# because it legitimately imports from app.core.domain (dependency inversion
# via Protocol implementations). The forbidden contract below enforces the
# reverse direction.

[[tool.importlinter.contracts]]
name = "Domain has no infrastructure or framework imports"
type = "forbidden"
source_modules = ["app.core.domain"]
forbidden_modules = [
    "app.infrastructure",
    "app.presentation",
    "fastapi",
    "sqlmodel",
    "sqlalchemy",
    "beanie",
    "motor",
]

[[tool.importlinter.contracts]]
name = "Domain has no application imports"
type = "forbidden"
source_modules = ["app.core.domain"]
forbidden_modules = ["app.core.application"]

[[tool.importlinter.contracts]]
name = "Shared kernel is dependency-free"
type = "forbidden"
source_modules = ["app.shared"]
forbidden_modules = ["app.core", "app.platform", "app.presentation", "app.infrastructure"]

[[tool.importlinter.contracts]]
name = "Platform cannot import BC domain/application code"
type = "forbidden"
source_modules = ["app.platform"]
forbidden_modules = ["app.core.domain", "app.core.application"]
ignore_imports = [
    "app.platform.web.exception_handlers -> app.core.domain.exceptions",
]
