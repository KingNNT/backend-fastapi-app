# Production Override Configuration
# Usage: docker-compose -f docker-compose.yaml -f docker-compose.production.yaml up -d
#
# This file extends the base docker-compose.yaml with production-specific settings

services:
  # ==========================================================================
  # Python Application - Production Mode
  # ==========================================================================
  python:
    container_name: ${APP_NAME:-backend-fastapi-app}-python
    hostname: python
    restart: unless-stopped
    build:
      context: .
      dockerfile: .docker/production/python/Dockerfile
      target: production
    networks:
      - network_app
    ports:
      - "8080:8000"
    volumes:
      # Only mount logs directory in production
      - ./.log:/app/logs
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - MONGODB_URL=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${APP_NAME:-backend-fastapi-app}-mongodb:27017/${MONGODB_DATABASE}?authSource=admin
      - MONGODB_DATABASE=${MONGODB_DATABASE}
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthcheck is defined in the Dockerfile for production
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ==========================================================================
  # MongoDB - Production Overrides (no exposed ports)
  # ==========================================================================
  mongodb:
    # No ports exposed in production for security
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # PostgreSQL - Production Overrides (no exposed ports)
  # ==========================================================================
  postgresql:
    # No ports exposed in production for security
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Redis - Production Overrides (no exposed ports)
  # ==========================================================================
  redis:
    # No ports exposed in production for security
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
