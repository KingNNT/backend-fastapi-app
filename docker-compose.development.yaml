networks:
    network_app:
        driver: bridge

volumes:
    mongodb_data:

services:
    python:
        container_name: ${APP_NAME}-server_python
        hostname: ${APP_NAME}-server_python
        restart: unless-stopped
        build:
            context: .
            dockerfile: .docker/development/python/Dockerfile
        tty: true
        networks:
            - network_app
        ports:
            - 8080:8000
        volumes:
            - .:/app
        environment:
            MONGODB_URL: mongodb://${MONGODB_ROOT_USERNAME:-admin}:${MONGODB_ROOT_PASSWORD:-password}@${APP_NAME}-mongodb:27017/${MONGODB_DATABASE:-backend_fastapi_app}?authSource=admin
            MONGODB_DATABASE: ${MONGODB_DATABASE:-backend_fastapi_app}
        depends_on:
            mongodb:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "--fail",
                    "http://127.0.0.1:8000/health-check",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    mongodb:
        container_name: ${APP_NAME}-mongodb
        hostname: ${APP_NAME}-mongodb
        image: mongo:7.0
        restart: unless-stopped
        networks:
            - network_app
        ports:
            - "27017:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-admin}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-password}
            MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-backend_fastapi_app}
        volumes:
            - mongodb_data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
