networks:
    network_app:
        driver: bridge

volumes:
    mongodb_data:
    postgresql_volume:
    redis_data:

services:
    python:
        container_name: ${APP_NAME}_python
        hostname: ${APP_NAME}-python
        restart: unless-stopped
        build:
            context: .
            dockerfile: .docker/development/python/Dockerfile
        tty: true
        networks:
            - network_app
        ports:
            - 8080:8000
        volumes:
            - .:/app
        environment:
            MONGODB_URL: mongodb://${MONGODB_ROOT_USERNAME:-admin}:${MONGODB_ROOT_PASSWORD:-password}@${APP_NAME}-mongodb:27017/${MONGODB_DATABASE:-backend_fastapi_app}?authSource=admin
            MONGODB_DATABASE: ${MONGODB_DATABASE:-backend_fastapi_app}
        depends_on:
            mongodb:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "--fail",
                    "http://127.0.0.1:8000/health-check",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    mongodb:
        container_name: ${APP_NAME}-mongodb
        hostname: ${APP_NAME}-mongodb
        image: mongo:7.0
        restart: unless-stopped
        networks:
            - network_app
        ports:
            - "27017:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-admin}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-password}
            MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-backend_fastapi_app}
        volumes:
            - mongodb_data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    postgresql:
        container_name: ${APP_NAME}-postgresql
        hostname: ${APP_NAME}-postgresql
        restart: unless-stopped
        build:
            context: .
            dockerfile: .docker/development/postgresql/Dockerfile
            args:
                - POSTGRES_USER=${POSTGRES_USER}
                - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
                - POSTGRES_DB=${POSTGRES_DB}
        networks:
            - network_app
        ports:
            - 5442:5432
        volumes:
            - postgresql_volume:/var/lib/postgresql/data
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
            interval: 30s
            timeout: 60s
            retries: 5
            start_period: 80s

    redis:
        container_name: ${APP_NAME}-redis
        hostname: ${APP_NAME}-redis
        restart: unless-stopped
        build:
            context: .docker/development/redis
            dockerfile: Dockerfile
        networks:
            - network_app
        ports:
            - 6379:6379
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
